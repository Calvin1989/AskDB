server:
  port: 8088

logging:
  level:
    net.sf.jsqlparser: warn   # JSqlParser 每解析一次都打几行 INFO 日志，关掉

spring:
  application:
    name: askdb
  # 本地私密配置（数据库密码、API Key）写在项目根目录的 askdb-local.yml 里，不提交到 Git。
  # 复制 askdb-local.example.yml 改名即可；文件不存在也能启动
  config:
    import: optional:file:./askdb-local.yml
  # import（导入数据）和 setup-reader（建只读账号）都要用 root 账号、不启动 Web 服务，
  # 这些共同的设置放在 application-admin.yml，两个配置都会自动带上
  profiles:
    group:
      import: admin
      setup-reader: admin

  # 服务运行时用只读账号 askdb_reader（建账号见 db/setup-reader.sql）
  # 导入数据、建只读账号时用管理员账号，见 application-admin.yml
  datasource:
    url: jdbc:mysql://localhost:3306/askdb?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useInformationSchema=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:askdb_reader}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  # 调模型的 HTTP 超时：连不上 5 秒放弃，等回复最多 60 秒
  http:
    client:
      connect-timeout: 5s
      read-timeout: 60s

  ai:
    # Spring AI 默认失败后最多重试 10 次、单次最长等 3 分钟，一个请求可能挂十几分钟。
    # 改成：总共最多调 3 次（重试 2 次），等待 1 秒、2 秒。
    # 4xx 错误（如 401 Key 填错）重试也没用，不重试；但 429（请求太频繁）是例外，等一下再试就好，
    # 必须单独列出来，否则会被当成 4xx 直接失败
    retry:
      max-attempts: 3
      on-client-errors: false
      on-http-codes: 429
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
    # 模型客户端由 LlmClientFactory 按页面上的设置创建（见 askdb.llm），Spring AI 自动创建的都关掉
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

askdb:
  # 大模型设置。最方便的是在页面左下角的"模型设置"里填，保存后写入 askdb-llm.json，以它为准。
  # 也可以写在 askdb-local.yml 或环境变量里作为初始值。DeepSeek、通义千问都兼容 OpenAI 协议：
  #   DeepSeek:  base-url=https://api.deepseek.com                       model=deepseek-chat
  #   通义千问:   base-url=https://dashscope.aliyuncs.com/compatible-mode  model=qwen-plus
  llm:
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
    temperature: 0             # 生成 SQL 要稳定，评测结果才能复现
    settings-file: askdb-llm.json
    editable: ${ASKDB_LLM_EDITABLE:true}   # 部署到公网时设为 false，否则任何人都能在页面上改你的 Key
  query:
    max-rows: 200
    timeout-seconds: 10
  # 下面几项是准确率改进，都可以单独关掉做对比实验；application-baseline.yml 把它们全部关掉
  schema:
    strategy: retrieval        # retrieval = 按问题选表；full = 全部表
    max-tables: 4
    relative-threshold: 0.35
  glossary:
    enabled: true              # 业务词典：resources/glossary.json
  correction:
    max-attempts: 2            # SQL 报错后最多修正几次，0 = 不修正
  examples:
    enabled: true              # 示例库：页面上标记"正确"的问题和 SQL
    max-examples: 3
    min-similarity: 0.3
  # 提问接口限流：每个 IP 每分钟最多 10 次。多台服务器部署时 store 改成 redis
  rate-limit:
    enabled: true
    store: memory
    requests: 10
    window: 60s
  # 相同问题直接返回缓存。需要先启动 Redis，所以默认关闭
  cache:
    enabled: ${ASKDB_CACHE_ENABLED:false}
    ttl: 30m
  # 每次提问记一条日志到 askdb_meta.query_log
  query-log:
    enabled: true
