name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试（含 MySQL 集成测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # GitHub 的机器自带 Docker，MySqlIntegrationTest 会用 Testcontainers 启动真实的 MySQL
      - run: mvn -B test
      # 集成测试在没有 Docker 时会自动跳过，这里确认它在 CI 上真的跑了，而不是悄悄跳过
      - name: 确认 MySQL 集成测试真的执行了
        run: |
          report=target/surefire-reports/TEST-com.askdb.MySqlIntegrationTest.xml
          grep -Eq 'tests="[1-9]' "$report" && grep -q 'skipped="0"' "$report"

  frontend:
    name: 前端测试和打包
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: askdb-web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: askdb-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build   # 包含 TypeScript 类型检查

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t askdb .
