name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端测试（含 MySQL 集成测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # GitHub 的机器自带 Docker，MySqlIntegrationTest 会用 Testcontainers 启动真实的 MySQL
      - run: mvn -B test

  frontend:
    name: 前端测试和打包
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: askdb-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: askdb-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build   # 包含 TypeScript 类型检查

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t askdb .
